[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "boundarybench"
version = "0.3.0"
description = "Synthetic authorization-laundering benchmark for tool-using AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{ name = "Yusuf Muhammed" }]

[project.urls]
Repository = "https://github.com/yusstech/BoundaryBench"
Issues = "https://github.com/yusstech/BoundaryBench/issues"

[project.optional-dependencies]
live = ["anthropic>=2.4"]

[tool.setuptools.packages.find]
include = ["boundarybench*"]
